
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Gestão de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h2>Cadastro de Produto</h2>

        <form id="formProduto">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">

            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" min="0" step="0.01" required placeholder="0.00">

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="" disabled selected>Selecione uma categoria</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Periféricos">Periféricos</option>
            </select>

            <button type="submit">Salvar Produto</button>
        </form>

        <hr class="divisor">

        <section class="secao-busca">
            <h3>Produtos Cadastrados</h3>
            
            <div class="controles-busca">
                <input type="text" id="busca" placeholder="Buscar produto por nome...">
                <div class="filtros-categoria">
                    <button type="button" class="btn-filtro active" data-categoria="Todos">Todos</button>
                    <button type="button" class="btn-filtro" data-categoria="Eletrônicos">Eletrônicos</button>
                    <button type="button" class="btn-filtro" data-categoria="Periféricos">Periféricos</button>
                </div>
            </div>
        </section>

        <section id="lista-produtos" class="grid-produtos">
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
